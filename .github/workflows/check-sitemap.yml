name: Verify sitemap completeness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-sitemap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check every page is listed in sitemap.xml
        run: python3 scripts/check_sitemap.py
