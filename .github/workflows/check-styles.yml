name: Verify shared stylesheet copies

on:
  push:
    branches: [main, orisod-2]
  pull_request:
    branches: [main, orisod-2]

permissions:
  contents: read

jobs:
  check-styles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check every page's copy of assets/css/orisod.css matches the source
        run: python3 scripts/check_styles.py

      - name: Check the stylesheet check still fails when it should
        run: python3 scripts/test_check_styles.py

      - name: Check every page's Lucide icons match the vendored files
        run: python3 scripts/sync_icons.py --check

      - name: Check the icon sync still fails when it should
        run: python3 scripts/test_sync_icons.py

      - name: Check the Related tools tiles of the page frame (sync_related_cards.py)
        run: python3 scripts/test_sync_related_cards.py
