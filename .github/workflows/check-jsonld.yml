name: Verify structured data (JSON-LD)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-jsonld:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check every page's JSON-LD is valid and matches the page
        run: python3 scripts/check_jsonld.py
