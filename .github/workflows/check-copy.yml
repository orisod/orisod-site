name: Verify script message copy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check script messages have no em dashes or "(s)" plurals
        run: python3 scripts/check_copy.py

      - name: Check no literal bidi control characters in our code (scripts, site JS, inline page scripts)
        run: python3 scripts/check_bidi_chars.py

      - name: Check check_bidi_chars.py still catches them
        run: python3 scripts/test_check_bidi_chars.py
