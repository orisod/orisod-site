name: Verify script message copy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check script messages have no em dashes or "(s)" plurals
        run: python3 scripts/check_copy.py
