name: Verify link-preview tags

on:
  push:
    branches: [main, orisod-2]
  pull_request:
    branches: [main, orisod-2]

permissions:
  contents: read

jobs:
  check-social:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check every page has link-preview tags matching the page
        run: python3 scripts/check_social.py
