name: Verify PDF.js security setting

on:
  push:
    branches: [main, orisod-2]
  pull_request:
    branches: [main, orisod-2]

permissions:
  contents: read

jobs:
  check-pdfjs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check every PDF.js getDocument() call disables eval (CVE-2024-4367)
        run: python3 scripts/check_pdfjs.py

      - name: Prove each PDF.js rule fails on a broken copy
        run: python3 scripts/test_check_pdfjs.py
