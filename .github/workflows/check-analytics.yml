name: Verify analytics (GoatCounter only)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-analytics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check every page loads GoatCounter once and no other analytics
        run: python3 scripts/check_analytics.py
