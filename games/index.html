<style>
@font-face{
  font-family:'Inter';
  src:url('assets/fonts/Inter-Variable.woff2') format('woff2-variations'),
      url('assets/fonts/Inter-Variable.woff2') format('woff2');
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'Plus Jakarta Sans';
  src:url('assets/fonts/PlusJakartaSans-Variable.woff2') format('woff2-variations'),
      url('assets/fonts/PlusJakartaSans-Variable.woff2') format('woff2');
  font-weight:200 800;
  font-style:normal;
  font-display:swap;
}
:root{
  --s0:#0b0e15; --s1:#12151d; --s2:#191c26; --s3:#22262f; --s4:#2b2e38; --s5:#32353d;
  --primary:#2563eb; --primary-light:#b4c5ff;
  --secondary:#00a6e0; --secondary-light:#7bd0ff;
  --tertiary:#585be6; --tertiary-light:#c0c1ff;
  --text:#f1f5f9; --text-muted:#93a0b4;
  --border:#262b36; --border-soft:#1c2029;
  --amber:#f59e0b; --amber-light:#fcd9a8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--s0);}
body{
  min-height:100vh;
  font-family:'Inter',Arial,Helvetica,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(0,166,224,.09) 0%, transparent 42%),
    radial-gradient(circle at 85% 30%, rgba(37,99,235,.10) 0%, transparent 46%),
    radial-gradient(circle at 50% 85%, rgba(88,91,230,.07) 0%, transparent 52%);
}
h1,h2,h3{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;margin:0;}
.app-shell{max-width:560px;margin:0 auto;position:relative;min-height:100vh;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* header */
.site-header{
  position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:50;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(11,14,21,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(0,166,224,.14);
}
.header-inner{padding:10px 16px 8px 16px;display:flex;flex-direction:column;gap:8px;}
.header-top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand img{height:26px;width:26px;border-radius:7px;display:block;}
.brand-text{display:flex;align-items:center;gap:6px;}
.brand-name{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px;letter-spacing:.03em;color:#fff;}
.brand-badge{
  padding:2px 7px;border-radius:4px;background:rgba(37,99,235,.22);border:1px solid rgba(37,99,235,.55);
  color:var(--secondary-light);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.back-pill{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--s2);border:1px solid var(--border);color:var(--text-muted);
  text-decoration:none;font-size:11px;transition:border-color .15s,color .15s;
}
.back-pill:hover{border-color:rgba(0,166,224,.5);color:var(--secondary-light);}
.back-pill svg{width:12px;height:12px;transition:transform .15s;}
.back-pill:hover svg{transform:translateX(-2px);}
.breadcrumb-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);letter-spacing:.02em;}
.breadcrumb-row .crumb-active{color:var(--secondary-light);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.breadcrumb-row .crumb-active svg{width:12px;height:12px;}
.breadcrumb-row .sep{color:#3a4152;}

/* main */
main{padding-top:78px;padding-bottom:96px;}

.controls{
  padding:12px 14px;display:flex;flex-direction:column;gap:10px;
  background:rgba(11,14,21,.55);border-bottom:1px solid rgba(37,99,235,.08);
}
.search-wrap{position:relative;}
.search-wrap svg.search-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--secondary-light);opacity:.75;pointer-events:none;
}
#gameSearchInput{
  width:100%;padding:9px 60px 9px 34px;border-radius:10px;background:var(--s1);
  border:1px solid rgba(0,166,224,.22);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
#gameSearchInput::placeholder{color:#697285;}
#gameSearchInput:focus{outline:none;border-color:rgba(0,166,224,.65);background:var(--s2);box-shadow:0 0 0 3px rgba(0,166,224,.12);}
.ready-tag{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:2px 7px;border-radius:5px;
  background:var(--s3);border:1px solid var(--border);color:var(--text-muted);font-size:9px;font-weight:700;letter-spacing:.08em;
}
.pill-scroller{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;}
.pill-scroller::-webkit-scrollbar{display:none;}
.cat-pill{
  flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;
  background:var(--s2);border:1px solid var(--border);color:var(--text-muted);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
}
.cat-pill:hover{color:var(--text);border-color:rgba(0,166,224,.4);}
.cat-pill .count{padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.08);font-size:10px;}
.cat-pill.active{
  background:var(--primary);color:#fff;border-color:rgba(123,208,255,.6);
  box-shadow:0 0 14px rgba(37,99,235,.5);
}
.cat-pill.active .count{background:rgba(0,0,0,.25);color:var(--secondary-light);}

.trust-strip{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  padding:9px 14px;font-size:11px;color:var(--text-muted);
  border-bottom:1px solid rgba(0,166,224,.08);
}
.trust-strip .item{display:inline-flex;align-items:center;gap:5px;}
.trust-strip svg{width:13px;height:13px;color:var(--secondary-light);}
.trust-strip .dot{color:#3a4152;}

/* catalog */
#catalogContent{padding:14px 14px 8px 14px;display:flex;flex-direction:column;gap:20px;}
.game-section{display:flex;flex-direction:column;gap:10px;}
.section-head{display:flex;align-items:center;gap:8px;}
.section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.section-head h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#e7ebf3;}
.section-badge{padding:2px 7px;border-radius:5px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid;}
.section-line{flex:1;height:1px;background:linear-gradient(90deg, currentColor, transparent);opacity:.35;}
.section-count{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}

.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.game-card{
  position:relative;display:flex;flex-direction:column;border-radius:16px;
  background:linear-gradient(180deg, var(--s2), var(--s1));
  border:1px solid var(--border);padding:8px;cursor:pointer;
  transition:border-color .18s,transform .18s,box-shadow .18s;
  font:inherit;color:inherit;text-align:left;
}
.game-card:hover{transform:translateY(-2px);}
.game-card:focus-visible{outline:2px solid var(--secondary-light);outline-offset:2px;}
.thumb{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:11px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.thumb svg{width:42%;height:42%;position:relative;z-index:1;}
.thumb-tag{
  position:absolute;top:6px;right:6px;padding:2px 6px;border-radius:5px;
  background:rgba(11,14,21,.85);backdrop-filter:blur(4px);border:1px solid;
  display:flex;align-items:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:.04em;
}
.thumb-tag svg{width:10px;height:10px;}
.card-body{display:flex;flex-direction:column;gap:6px;padding-top:9px;flex:1;justify-content:space-between;}
.card-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;color:#f2f4f8;line-height:1.25;}
.card-desc{font-size:11px;color:var(--text-muted);line-height:1.4;}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:7px;border-top:1px solid var(--border-soft);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;font-size:9.5px;font-weight:700;border:1px solid;}
.badge .diff-dot{width:6px;height:6px;border-radius:50%;}
.badge svg{width:10px;height:10px;}

/* category accent variants */
.accent-arcade{color:var(--secondary);}
.thumb.accent-arcade{background:linear-gradient(155deg, rgba(0,166,224,.28), rgba(11,14,21,.9));}
.game-card.accent-arcade{border-color:rgba(0,166,224,.22);}
.game-card.accent-arcade:hover{border-color:rgba(0,166,224,.55);box-shadow:0 0 20px rgba(0,166,224,.16);}
.thumb-tag.accent-arcade{border-color:rgba(0,166,224,.4);color:var(--secondary-light);}

.accent-logic{color:var(--primary);}
.thumb.accent-logic{background:linear-gradient(155deg, rgba(37,99,235,.30), rgba(11,14,21,.9));}
.game-card.accent-logic{border-color:rgba(37,99,235,.22);}
.game-card.accent-logic:hover{border-color:rgba(37,99,235,.55);box-shadow:0 0 20px rgba(37,99,235,.16);}
.thumb-tag.accent-logic{border-color:rgba(37,99,235,.4);color:var(--primary-light);}

.accent-words{color:var(--tertiary);}
.thumb.accent-words{background:linear-gradient(155deg, rgba(88,91,230,.30), rgba(11,14,21,.9));}
.game-card.accent-words{border-color:rgba(88,91,230,.22);}
.game-card.accent-words:hover{border-color:rgba(88,91,230,.55);box-shadow:0 0 20px rgba(88,91,230,.16);}
.thumb-tag.accent-words{border-color:rgba(88,91,230,.4);color:var(--tertiary-light);}

.badge-diff-low{background:rgba(0,166,224,.12);border-color:rgba(0,166,224,.35);color:var(--secondary-light);}
.badge-diff-low .diff-dot{background:var(--secondary);}
.badge-diff-med{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.32);color:var(--amber-light);}
.badge-diff-med .diff-dot{background:var(--amber);}
.badge-mode{background:var(--s3);border-color:var(--border);color:var(--text-muted);}

/* empty state */
#catalogEmptyState{
  display:none;flex-direction:column;align-items:center;text-align:center;
  padding:36px 20px;border-radius:16px;background:var(--s1);border:1px solid var(--border);
}
#catalogEmptyState.visible{display:flex;}
#catalogEmptyState svg{width:34px;height:34px;color:var(--secondary-light);margin-bottom:10px;}
#catalogEmptyState p.title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;}
#catalogEmptyState p.sub{font-size:12px;color:var(--text-muted);margin-top:4px;max-width:240px;}
#resetFilterBtn{
  margin-top:14px;padding:7px 16px;border-radius:999px;background:var(--primary);color:#fff;border:1px solid rgba(123,208,255,.5);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
}
#resetFilterBtn:hover{filter:brightness(1.1);}

/* toast */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%, 12px);max-width:calc(560px - 32px);width:calc(100% - 32px);
  background:var(--s2);border:1px solid rgba(0,166,224,.4);border-radius:12px;padding:11px 14px;
  display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;
}
#toast.visible{opacity:1;transform:translate(-50%, 0);}
#toast svg{width:16px;height:16px;color:var(--secondary-light);flex-shrink:0;}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(11,14,21,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(0,166,224,.16);
}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;height:62px;padding:0 8px;}
.nav-tab{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-width:58px;padding:4px 0;text-decoration:none;color:var(--text-muted);background:none;border:none;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:600;cursor:pointer;
}
.nav-tab svg{width:20px;height:20px;}
.nav-tab.active{color:var(--secondary-light);}
.nav-tab.active::before{
  content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:26px;height:2px;
  background:var(--secondary);box-shadow:0 0 8px var(--secondary);border-radius:2px;
}
.nav-tab.inactive{opacity:.55;cursor:default;}
.nav-tab .soon-tag{
  position:absolute;top:-2px;right:2px;padding:1px 4px;border-radius:4px;background:var(--s3);
  font-size:7px;font-weight:700;letter-spacing:.03em;color:var(--text-muted);text-transform:uppercase;
}

@media (min-width:560px){
  .site-header, .bottom-nav{border-left:1px solid rgba(0,166,224,.1);border-right:1px solid rgba(0,166,224,.1);}
}
</style>
</head>

<div class="app-shell">

<header class="site-header">
  <div class="header-inner">
    <div class="header-top-row">
      <h1 class="brand">
        <img src="assets/orisod-icon-detailed.png" alt="" width="26" height="26">
        <span class="brand-text">
          <span class="brand-name">ORISOD</span>
          <span class="brand-badge">Games</span>
        </span>
      </h1>
      <a class="back-pill" href="https://orisod.com">
        <svg viewBox="0 0 24 24"><use href="#i-arrow-left"></use></svg>
        <span>orisod.com</span>
      </a>
    </div>
    <div class="breadcrumb-row">
      <span class="crumb-active"><svg viewBox="0 0 24 24"><use href="#i-gamepad"></use></svg>Arcade console</span>
      <span class="sep">/</span>
      <span>Lobby</span>
    </div>
  </div>
</header>

<main>
  <div class="controls">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><use href="#i-search"></use></svg>
      <input type="search" id="gameSearchInput" placeholder="Search games..." aria-label="Search games">
      <span class="ready-tag">Ready</span>
    </div>
    <div class="pill-scroller" id="categoryScroller" role="group" aria-label="Filter games by category">
      <button type="button" class="cat-pill active" data-cat="all">All games <span class="count">4</span></button>
      <button type="button" class="cat-pill" data-cat="Arcade">Arcade <span class="count">1</span></button>
      <button type="button" class="cat-pill" data-cat="Logic">Logic <span class="count">2</span></button>
      <button type="button" class="cat-pill" data-cat="Words">Words <span class="count">1</span></button>
    </div>
  </div>

  <div class="trust-strip">
    <span class="item"><svg viewBox="0 0 24 24"><use href="#i-bolt"></use></svg>Instant play</span>
    <span class="dot">&middot;</span>
    <span class="item">No install</span>
    <span class="dot">&middot;</span>
    <span class="item">No account needed</span>
  </div>

  <div id="catalogContent">

    <section class="game-section" data-category="Arcade">
      <div class="section-head accent-arcade">

<script>
(function(){
  var searchInput = document.getElementById('gameSearchInput');
  var pills = document.querySelectorAll('.cat-pill');
  var cards = document.querySelectorAll('.game-card');
  var sections = document.querySelectorAll('.game-section');
  var emptyState = document.getElementById('catalogEmptyState');
  var resetBtn = document.getElementById('resetFilterBtn');
  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastTimer = null;

  var currentCat = 'all';
  var searchQuery = '';

  function applyFilters(){
    var totalVisible = 0;
    sections.forEach(function(section){
      var sectionCards = section.querySelectorAll('.game-card');
      var visibleInSection = 0;
      sectionCards.forEach(function(card){
        var title = card.getAttribute('data-title').toLowerCase();
        var cat = card.getAttribute('data-cat');
        var matchesCat = (currentCat === 'all' || cat === currentCat);
        var matchesSearch = title.indexOf(searchQuery) !== -1;
        if (matchesCat && matchesSearch) {
          card.style.display = '';
          visibleInSection++;
          totalVisible++;
        } else {
          card.style.display = 'none';
        }
      });
      section.style.display = visibleInSection === 0 ? 'none' : '';
    });
    emptyState.classList.toggle('visible', totalVisible === 0);
  }

  pills.forEach(function(pill){
    pill.addEventListener('click', function(){
      pills.forEach(function(p){ p.classList.remove('active'); });
      pill.classList.add('active');
      currentCat = pill.getAttribute('data-cat');
      applyFilters();
    });
  });

  searchInput.addEventListener('input', function(e){
    searchQuery = e.target.value.toLowerCase().trim();
    applyFilters();
  });

  resetBtn.addEventListener('click', function(){
    searchInput.value = '';
    searchQuery = '';
    pills[0].click();
  });

  function showToast(msg){
    toastText.textContent = msg;
    toast.classList.add('visible');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('visible'); }, 2600);
  }

  cards.forEach(function(card){
    card.addEventListener('click', function(){
      showToast(card.getAttribute('data-title') + ' is coming soon');
    });
  });
})();
</script>
